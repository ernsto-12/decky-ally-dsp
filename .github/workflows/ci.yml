name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run typecheck
      - run: node --test tests/test_debounced_value_writer.mjs
      - run: pnpm audit --prod --audit-level=high
      - name: Backend syntax and tests
        run: |
          python3 -m compileall -q main.py py_modules/allydsp
          python3 -m pip install --quiet pytest
          python3 -m pytest tests/ -q
          bash -n install.sh scripts/*.sh
      - name: Assemble runtime pieces (converter, LV2 bundle)
        run: |
          scripts/assemble-converter.sh
          sudo apt-get install -y -qq zstd >/dev/null
          scripts/fetch-lsp.sh
      - name: Package (unsigned, artifact only)
        run: scripts/package.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin-zip-unsigned
          path: |
            out/ally-dsp-*.zip
            out/SHA256SUMS
